<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="gold-i" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFBE7A"/>
      <stop offset="50%" stop-color="#C6A664"/>
      <stop offset="100%" stop-color="#8E7036"/>
    </linearGradient>
    <radialGradient id="glow-i" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C6A664" stop-opacity="0.16"/>
      <stop offset="70%" stop-color="#C6A664" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#080808" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="320" fill="#0C0C0C"/>
  <circle cx="200" cy="160" r="120" fill="url(#glow-i)"/>
  <!-- Elegant geometric arabesque / rosette motif -->
  <g stroke="url(#gold-i)" fill="none" opacity="0.75" stroke-width="1">
    <ellipse cx="200" cy="160" rx="35" ry="75"/>
    <ellipse cx="200" cy="160" rx="75" ry="35"/>
    <ellipse cx="200" cy="160" rx="55" ry="55" transform="rotate(45 200 160)"/>
    <ellipse cx="200" cy="160" rx="55" ry="55" transform="rotate(-45 200 160)"/>
  </g>
  <circle cx="200" cy="160" r="18" fill="url(#gold-i)" fill-opacity="0.1" stroke="url(#gold-i)" stroke-width="1.2"/>
  <circle cx="200" cy="160" r="4" fill="url(#gold-i)"/>
  <text x="200" y="295" text-anchor="middle" fill="#A89F91" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" letter-spacing="2" opacity="0.6">ABSTRACT VISUAL IMPRESSION</text>
</svg>
